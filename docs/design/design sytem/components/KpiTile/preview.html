<!doctype html>
<html lang="tr" data-theme="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><title>KPI kutucuğu</title>
<style>html,body{margin:0;background:var(--bg-base)} .wrap{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start} .ph{width:358px;max-width:100%}</style>
</head>
<body>
<div class="m-screen wrap">

<div class="ph" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<button type="button" class="m-kpi"><span class="m-kpi__head"><span class="m-kpi__chip" aria-hidden="true" style="color:var(--accent-text)"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></span><span class="m-cap" style="flex:1 1 auto">Tamamlanma</span><span style="color:var(--ink-faint)"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></span></span><span class="m-kpi__num">%49</span><span class="m-bar"><span style="width:49%;background:var(--accent-text)"></span></span><span class="m-cap">79 görevin 39'u bitti</span></button>
<button type="button" class="m-kpi"><span class="m-kpi__head"><span class="m-kpi__chip" aria-hidden="true" style="color:var(--danger)"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"></path></svg></span><span class="m-cap" style="flex:1 1 auto">Gecikmede</span><span style="color:var(--ink-faint)"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M9 7h8v8"></path></svg></span></span><span class="m-kpi__num" style="color:var(--danger)">15</span><span class="m-bar"><span style="width:38%;background:var(--danger)"></span></span><span class="m-cap">Açık görevlerin %38'i</span></button>
</div>
</div>
<script>window.RoketPortalMobil && window.RoketPortalMobil.init(document);</script>
</body>
</html>
