name: ci

# NIZAM.IO mobil istemcisi — kalite kapısı (F14 MOB-0 kapsam 11).
# Sıra: kurulum (pubspec.lock donuk) → biçim → analiz → sınır kuralı → birim testleri;
# ayrı iş: Android derlemesi (dev debug + prod release --obfuscate).
# Eylemler commit SHA'sına, Flutter sürümü pubspec.yaml `environment.flutter` alanına sabittir.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 'format · analyze · sınır · test'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter kur (pubspec.yaml environment.flutter)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Bağımlılıklar (--enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Biçim denetimi (dart format)
        run: make format-check

      - name: Statik analiz (--fatal-infos)
        run: make analyze

      - name: Sınır kuralı (tool/check_boundaries.dart)
        run: make boundaries

      - name: Birim testleri
        run: make test

  android:
    name: 'Android derlemesi (dev debug, prod release --obfuscate)'
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur (pubspec.yaml environment.flutter)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Bağımlılıklar (--enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: 'flutter build apk --debug (dev flavor)'
        run: make build-dev-apk

      - name: 'flutter build apk --release --obfuscate (prod flavor, debug anahtarı; dağıtılmaz)'
        run: |
          make build-prod-apk
          ls build/symbols/*.symbols >/dev/null || { echo "::error::--split-debug-info sembolleri yok (obfuscate uygulanmadı)"; exit 1; }
