name: nizamio
description: "NIZAM.IO mobil istemcisi (Flutter). MOB-0 altyapı iskeleti; ekran yok (D-0174)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2
  # Flutter stable pini (CI flutter-version-file bunu okur; yerel sürüm aynı olmalı).
  flutter: 3.47.2

dependencies:
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_messaging: ^16.7.0
  firebase_remote_config: ^6.7.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  gap: ^3.0.1
  get_it: ^9.3.0
  go_router: ^18.0.2
  google_fonts: ^8.2.1
  intl: ^0.20.3
  json_annotation: ^4.12.0
  meta: ^1.19.0
  path_provider: ^2.1.6
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  riverpod_generator: ^4.0.9
  freezed: ^4.0.1
  json_serializable: ^6.14.1
  analyzer: ^13.3.0
  path: ^1.9.1
  yaml: ^3.1.4
  swagger_parser: ^1.45.0
  retrofit_generator: ^10.2.11
  drift_dev: ^2.35.1
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  # Yazı tipleri google_fonts adlandırmasıyla (Aile-Ağırlık.ttf) uygulamayla gelir; çalışma
  # anında indirme kapalı (bootstrap). Lisanslar OFL-*.txt.
  assets:
    - assets/fonts/
  # gen-l10n (l10n.yaml); çıktı lib/core/i18n/generated/ commit'lenir.
  generate: true

# Uygulama simgesi ve açılış ekranı — YER TUTUCU marka (KR-13; birincil renk token'ı
# primary600 + "N"). Gerçek marka görselleri assets/branding/ altına aynı adlarla konup
# `make branding` çalıştırılır.
flutter_launcher_icons:
  image_path: assets/branding/icon.png
  android: true
  adaptive_icon_background: "#1F4E79"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  min_sdk_android: 26
  ios: true
  remove_alpha_ios: true

flutter_native_splash:
  color: "#1F4E79"
  image: assets/branding/splash.png
  android_12:
    color: "#1F4E79"
    image: assets/branding/splash.png
  android: true
  ios: true
  web: false
