<!doctype html>
<html lang="tr" data-theme="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><title>Mesaj işlemleri</title>
<style>html,body{margin:0;background:var(--bg-base)} .wrap{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start} .ph{width:358px;max-width:100%}</style>

<div class="m-screen wrap">

<div class="ph"><div class="m-sheet" role="dialog" aria-label="Mesaj işlemleri" style="animation:none;padding-bottom:16px">

<div style="display:flex;flex-direction:column;gap:12px;padding:0 16px">
<div class="m-reactbar" role="group" aria-label="Tepki bırak"><button type="button" aria-label="Beğen" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11v9H4v-9zM7 11l4-7c1.5 0 2.5 1 2.5 2.5V10h5a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.3 20H7"></path></svg></button><button type="button" aria-label="Kalp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button><button type="button" aria-label="Tamam"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg></button><button type="button" aria-label="Yıldız"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"></path></svg></button></div>
<div class="m-refrow"><button type="button"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13l2 2 4-4"></path></svg>ALT-5</button><button type="button"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg>Arşiv / ALT</button><button type="button"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true" style="width:14px;height:14px"><path d="M5 21V4a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v17M15 9h4a1 1 0 0 1 1 1v11M3 21h18"></path></svg>ALT</button></div>
<div class="m-quickgrid"><button type="button"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 6 6v5"></path></svg>Yanıtla</button><button type="button"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8h12v12H8zM4 16V4h12"></path></svg>Kopyala</button><button type="button"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4h6l-1 6 3 3H7l3-3zM12 13v7"></path></svg>Sabitle</button><button type="button"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"></path></svg>Düzenle</button></div>
<div class="m-rows"><div class="m-rows__item"><div class="m-row"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13l2 2 4-4"></path></svg><span>Göreve dönüştür</span><span></span></div></div><div class="m-rows__item"><div class="m-row" style="color:var(--danger)"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true" style="color:var(--danger)"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"></path></svg><span>Sil</span><span></span></div></div></div>
</div></div></div>
