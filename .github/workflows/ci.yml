name: ci

# NIZAM.IO mobil istemcisi — kalite kapısı (F14 MOB-0 kapsam 11).
# Sıra: kurulum (pubspec.lock donuk) → üretim kapısı (pinlerden yeniden üret, diff = 0) →
# biçim → analiz → sınır kuralı → test varlığı (Q2) → birim testleri + kapsama (Q1); ayrı işler:
# golden (Linux, sabit runner), Android derlemesi, entegrasyon.
# Eylemler commit SHA'sına, Flutter sürümü pubspec.yaml `environment.flutter` alanına sabittir.
#
# Backend deposu özeldir: salt okunur deploy key (BACKEND_DEPLOY_KEY) ile yalnız api-pin.json'daki
# ETİKET getirilir (.backend/, kimlik bilgisi saklanmaz). Web deposu açıktır: yalnız pinli COMMIT
# (.frontend/; tasarım token'ları + TR hata metinleri).

on:
  push:
    branches: [main]
  pull_request:
  # Golden referansı üretimi (`golden-update` işi). Yalnız varsayılan daldaki iş akışı elle
  # tetiklenebilir; main'e girmeden referans gerekiyorsa `golden` işinin başarısızlık
  # artefaktı (golden-referans) kullanılır.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 'format · analyze · sınır · test'
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter kur (pubspec.yaml environment.flutter)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Bağımlılıklar (--enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Pinleri oku (api-pin.json)
        id: pin
        run: |
          echo "tag=$(jq -r .backendTag api-pin.json)" >> "$GITHUB_OUTPUT"
          echo "web_repo=$(jq -r .web.repository api-pin.json)" >> "$GITHUB_OUTPUT"
          echo "web_commit=$(jq -r .web.commit api-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Backend sözleşmesini etiketten getir (salt okunur deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caliskan421/nizam.io--backend
          ref: refs/tags/${{ steps.pin.outputs.tag }}
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: .backend
          fetch-depth: 1
          persist-credentials: false

      - name: Web kaynaklarını sabit commit'ten getir (token'lar, TR metinler)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.pin.outputs.web_repo }}
          ref: ${{ steps.pin.outputs.web_commit }}
          path: .frontend
          fetch-depth: 1
          persist-credentials: false

      - name: 'Üretim kapısı: make gen (swagger_parser, ARB, token, build_runner), diff = 0'
        env:
          NIZAMIO_BACKEND_DIR: .backend
          NIZAMIO_FRONTEND_DIR: .frontend
        run: |
          if ! make gen-check; then
            echo "::error::Üretilmiş dosyalar pinli kaynaklarla uyuşmuyor; 'make gen' koşup commit'leyin."
            exit 1
          fi

      - name: Biçim denetimi (dart format)
        run: make format-check

      - name: Statik analiz (--fatal-infos)
        run: make analyze

      - name: Sınır kuralı (tool/check_boundaries.dart)
        run: make boundaries

      - name: 'Test varlığı (Q2: tool/check_test_presence.dart)'
        run: make test-presence

      - name: 'Birim testleri + kapsama eşikleri (Q1: tool/check_coverage.dart)'
        run: make coverage

      - name: 'Ayrım kapısı öz-testi: yasak işaretli sentetik APK reddedilir (SIGPIPE/pipefail körlüğü yok)'
        run: test_integration/backend/check-isolation-selftest.sh

  # Golden referansı yalnız burada üretilir/doğrulanır: runner etiketi SABİT (ubuntu-latest
  # taşınınca piksel kayması sessiz olmasın). Etiket değişimi bilinçli bir PR'dır; referanslar
  # yeni runner'da `golden-update` ile yeniden üretilip incelenir.
  golden:
    name: 'Golden (Linux, ubuntu-24.04)'
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter kur (pubspec.yaml environment.flutter)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Bağımlılıklar (--enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Golden testleri (referansla karşılaştır)
        id: golden
        run: make golden

      # Başarısızlıkta (referans yok/değişmiş) aynı runner'da referansı üretip artefakt yapar;
      # iş yine kırmızı kalır. Artefakt incelenmeden commit'lenmez (ADR-0003: görsel fark
      # incelenmeden referans değişmez).
      - name: Referans üret (yalnız golden başarısızsa)
        if: failure() && steps.golden.outcome == 'failure'
        run: make golden-update

      - name: Üretilen referansları yükle (golden-referans)
        if: failure() && steps.golden.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-referans
          path: test/**/goldens/**
          if-no-files-found: warn

  golden-update:
    name: 'Golden referansı üret (elle, ubuntu-24.04)'
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter kur (pubspec.yaml environment.flutter)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Bağımlılıklar (--enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Referansları üret (--update-goldens)
        run: make golden-update

      - name: Üretilen referansları yükle (golden-referans)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-referans
          path: test/**/goldens/**
          if-no-files-found: error

  android:
    name: 'Android derlemesi (dev debug, prod release --obfuscate)'
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur (pubspec.yaml environment.flutter)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Bağımlılıklar (--enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: 'flutter build apk --debug (dev flavor)'
        run: make build-dev-apk

      - name: 'flutter build apk --release --obfuscate (prod flavor, debug anahtarı; dağıtılmaz)'
        run: |
          make build-prod-apk
          ls build/symbols/*.symbols >/dev/null || { echo "::error::--split-debug-info sembolleri yok (obfuscate uygulanmadı)"; exit 1; }

      - name: 'Ayrım: entegrasyon ilk yönetici aracı APK''larda yok'
        run: test_integration/backend/check-isolation.sh apk

  integration:
    name: 'Entegrasyon (gerçek backend, etiket imajı; host VM, cihazsız)'
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16@sha256:ca0bd484cb98bf4b24eb1010e73fb3fcbd6714d240fbc1a10eea5b7dbecb641d
        env:
          # CI'ya özel, tek kullanımlık servis konteyneri kimliği; sır değildir.
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nizamio_f14_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nizamio_f14_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      NIZAMIO_IT_MODE: ci
      NIZAMIO_BACKEND_DIR: .backend
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Flutter kur (pubspec.yaml environment.flutter)
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Bağımlılıklar (--enforce-lockfile)
        run: flutter pub get --enforce-lockfile

      - name: Backend API pinini oku (api-pin.json)
        id: pin
        run: echo "tag=$(jq -r .backendTag api-pin.json)" >> "$GITHUB_OUTPUT"

      - name: Backend etiketini getir (salt okunur deploy key)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caliskan421/nizam.io--backend
          ref: refs/tags/${{ steps.pin.outputs.tag }}
          ssh-key: ${{ secrets.BACKEND_DEPLOY_KEY }}
          path: .backend
          fetch-depth: 1
          persist-credentials: false

      - name: 'Paylaşılan daemon: betiklerde docker tag/rmi yok (genel etiket değişmez)'
        run: |
          if grep -nE '^[^#]*docker[[:space:]]+((image[[:space:]]+)?tag|rmi|image[[:space:]]+(rm|prune)|system[[:space:]]+prune)([[:space:]]|$)' test_integration/backend/*.sh; then
            echo "::error::entegrasyon betiklerinde imaj etiketleme/silme komutu var"
            exit 1
          fi
          echo "entegrasyon betiklerinde docker tag/rmi yok"

      - name: 'Backend: etiketten docker build → roller → migrate → ilk yönetici → iki server'
        run: test_integration/backend/up.sh

      - name: 'Ayrım: ilk yönetici aracı backend çalışma imajında yok'
        run: test_integration/backend/check-isolation.sh image

      - name: 'Entegrasyon: doğrulama, prod reddi, sürüm uyumsuzluğu, giriş→me→yenileme→çıkış, K-05 + web oturumu'
        run: make integration-test

      - name: Backend günlüğü (hata durumunda)
        if: failure()
        run: |
          docker logs nizamio-f14-server || true
          docker logs nizamio-f14-server-minver || true

      - name: Backend'i kapat
        if: always()
        run: test_integration/backend/down.sh
