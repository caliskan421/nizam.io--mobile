<!doctype html>
<html lang="tr" data-theme="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><script src="../bundle.js"></script><title>Düğmeler</title>
<style>html,body{margin:0;background:var(--bg-base)} .wrap{padding:16px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start} .ph{width:358px;max-width:100%}</style>
</head>
<body>
<div class="m-screen wrap">

<div class="ph" style="display:flex;flex-direction:column;gap:12px">
<div style="display:grid;grid-template-columns:44px 44px minmax(0,1fr);gap:8px">
<button type="button" class="m-circle" aria-label="Tarih değişikliği iste"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"></path></svg></button>
<button type="button" class="m-circle" aria-label="Atanana hatırlat"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>
<button type="button" class="m-btn m-btn--primary"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H6v18h12V7zM14 3v4h4"></path></svg>Kanıt yükle</button>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px"><button type="button" class="m-btn m-btn--secondary">Reddet</button><button type="button" class="m-btn m-btn--primary">Onayla</button></div>
</div>
<div style="display:flex;gap:8px;align-items:center"><button type="button" class="m-circle" aria-label="Ara"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM20 20l-4-4"></path></svg></button><button type="button" class="m-circle" aria-label="Filtreler"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg></button><button type="button" class="m-circle m-circle--accent" aria-label="Yeni görev"><svg class="m-icon m-icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button><button type="button" class="m-glassbtn" aria-label="Menü"><svg class="m-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M10 17h10"></path></svg></button></div>
</div>
<script>window.RoketPortalMobil && window.RoketPortalMobil.init(document);</script>
